services:
  configure:
    build:
      context: ..
      dockerfile: shared/identity-provider/Dockerfile
      target: bootstrap
    command: ["P14"]
    environment:
      BOOTSTRAP_ISSUER: ${P14_ISSUER:-http://idp.localhost:4000}
      BOOTSTRAP_BASE_URL: ${P14_BASE_URL:-http://p14.localhost:3014}
      BOOTSTRAP_CLIENT_SECRET: ${P14_CLIENT_SECRET:-}
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - identity-config:/identity-config
      - app-config:/app-config

  identity-provider:
    build:
      context: ..
      dockerfile: shared/identity-provider/Dockerfile
    command: ["node", "--env-file=/run/config/.env", "dist/main.js"]
    environment:
      IDP_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      tutorial:
        aliases: [idp.localhost]
    volumes:
      - identity-config:/run/config:ro
    depends_on:
      configure: { condition: service_completed_successfully }
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  cedarschedule:
    build:
      context: ..
      dockerfile: p14-ai-scheduling-assistant/Dockerfile
    command: ["node", "--env-file=/run/config/app.env", "dist/server/main.js"]
    environment:
      P14_HOST: 0.0.0.0
      P14_PORT: 3014
      P14_DATA_DIR: /app/.local/p14-data
    ports:
      - "127.0.0.1:3014:3014"
    networks:
      tutorial:
        aliases: [p14.localhost]
    volumes:
      - app-config:/run/config:ro
      - p14-data:/app/.local/p14-data
    depends_on:
      configure: { condition: service_completed_successfully }
      identity-provider: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp:mode=1777]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3014/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  tutorial:

volumes:
  identity-config:
  app-config:
  p14-data:
