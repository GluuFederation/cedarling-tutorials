services:
  configure:
    build:
      context: ..
      dockerfile: shared/identity-provider/Dockerfile
      target: bootstrap
    command:
      - P7
    environment:
      BOOTSTRAP_ISSUER: ${P7_ISSUER:-http://localhost:18007}
      BOOTSTRAP_BASE_URL: ${P7_BASE_URL:-http://localhost:17007}
      BOOTSTRAP_CLIENT_SECRET: ${P7_CLIENT_SECRET:-}
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - identity-config:/identity-config
      - app-config:/app-config
  identity-provider:
    build:
      context: ..
      dockerfile: shared/identity-provider/Dockerfile
    command:
      - node
      - --env-file=/run/config/.env
      - dist/main.js
    environment:
      IDP_HOST: 0.0.0.0
    ports:
      - 127.0.0.1:18007:18007
      - 127.0.0.1:17007:17007
    networks:
      - tutorial
    volumes:
      - identity-config:/run/config:ro
    depends_on:
      configure:
        condition: service_completed_successfully
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:18007/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 2s
      timeout: 3s
      retries: 30
  cedardocs:
    build:
      context: ..
      dockerfile: p7-collaborative-docs/Dockerfile
    command:
      - node
      - --env-file=/run/config/app.env
      - dist/server/main.js
    environment:
      P7_HOST: 0.0.0.0
      P7_PORT: 17007
      P7_DATA_DIR: /app/.local/p7-data
    volumes:
      - app-config:/run/config:ro
      - p7-data:/app/.local/p7-data
    depends_on:
      configure:
        condition: service_completed_successfully
      identity-provider:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:17007/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 2s
      timeout: 3s
      retries: 30
    network_mode: service:identity-provider
networks:
  tutorial: null
volumes:
  identity-config: null
  app-config: null
  p7-data: null
