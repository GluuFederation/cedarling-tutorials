services:
  configure:
    build:
      context: ..
      dockerfile: shared/identity-provider/Dockerfile
      target: bootstrap
    command:
      - P2
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - identity-config:/identity-config
      - app-config:/app-config
  identity-provider:
    volumes:
      - identity-config:/run/config:ro
    depends_on:
      configure:
        condition: service_completed_successfully
    command:
      - node
      - --env-file=/run/config/.env
      - dist/main.js
    build:
      context: ..
      dockerfile: shared/identity-provider/Dockerfile
    environment:
      IDP_HOST: 0.0.0.0
    ports:
      - 127.0.0.1:18002:18002
      - 127.0.0.1:17002:17002
    networks:
      - tutorial
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:18002/health').then(r=>{if(!r.ok)process.exit(1)})
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  tenantrag:
    command:
      - node
      - --env-file=/run/config/app.env
      - dist/scripts/docker-start.js
    build:
      context: ..
      dockerfile: p2-tenantrag/Dockerfile
    environment:
      P2_HOST: 0.0.0.0
      P2_PROJECT_ROOT: /app
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - app-config:/run/config:ro
      - p2-data:/app/data
    env_file:
      - path: .env
        required: false
    depends_on:
      configure:
        condition: service_completed_successfully
      identity-provider:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:17002/openapi.json').then(r=>{if(!r.ok)process.exit(1)})
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    network_mode: service:identity-provider
networks:
  tutorial: null
volumes:
  identity-config: null
  app-config: null
  p2-data: null
