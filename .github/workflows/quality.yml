name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  step:
    name: Tutorial helper (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.helper == 'true'
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Check tutorial step helper
        id: check
        run: node --test shared/tools/step/run.test.mjs shared/tools/step/source.test.mjs

  changes:
    name: Select projects
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      projects: ${{ steps.select.outputs.projects }}
      compose: ${{ steps.select.outputs.compose }}
      helper: ${{ steps.select.outputs.helper }}
      concurrent: ${{ steps.select.outputs.concurrent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: shared/tools/repository-automation/pnpm-lock.yaml
      - name: Install repository automation
        working-directory: shared/tools/repository-automation
        run: pnpm install --frozen-lockfile
      - name: Check repository automation
        working-directory: shared/tools/repository-automation
        run: pnpm check
      - name: Audit repository automation
        timeout-minutes: 2
        working-directory: shared/tools/repository-automation
        run: pnpm audit --audit-level low
      - id: select
        name: Detect affected projects
        run: node shared/tools/repository-automation/changed-projects.mjs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  project:
    name: ${{ matrix.project }} (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.projects != '[]'
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        project: ${{ fromJSON(needs.changes.outputs.projects) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: |
            ${{ matrix.project }}/pnpm-lock.yaml
            shared/identity-provider/pnpm-lock.yaml
      - name: Runner identity
        run: node shared/tools/repository-automation/ci-report.mjs runner
      - name: Install
        id: install
        timeout-minutes: 3
        working-directory: ${{ matrix.project }}
        run: pnpm install --frozen-lockfile
      - name: Prepare shared identity provider
        id: identity
        timeout-minutes: 2
        if: matrix.project != 'shared/identity-provider'
        working-directory: shared/identity-provider
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install browser and Linux dependencies
        id: browser-linux
        timeout-minutes: 7
        if: (matrix.project == 'p1-task-manager' || matrix.project == 'p4-editorial-publishing' || matrix.project == 'p5-dataguard' || matrix.project == 'p6-field-inspection' || matrix.project == 'p7-collaborative-docs' || matrix.project == 'p10-warehouse-workloads' || matrix.project == 'p11-saas-workspace' || matrix.project == 'p14-capital-district' || matrix.project == 'p15-marketplace') && runner.os == 'Linux'
        working-directory: ${{ matrix.project }}
        run: node ../shared/tools/repository-automation/setup-browser.mjs
      - name: Install browser
        id: browser
        timeout-minutes: 3
        if: (matrix.project == 'p1-task-manager' || matrix.project == 'p4-editorial-publishing' || matrix.project == 'p5-dataguard' || matrix.project == 'p6-field-inspection' || matrix.project == 'p7-collaborative-docs' || matrix.project == 'p10-warehouse-workloads' || matrix.project == 'p14-capital-district' || matrix.project == 'p15-marketplace') && runner.os != 'Linux'
        working-directory: ${{ matrix.project }}
        run: pnpm exec playwright install --only-shell chromium
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 30000
      - name: Check
        id: check
        timeout-minutes: 5
        working-directory: ${{ matrix.project }}
        run: pnpm check
      - name: Run Linux integration scenario
        id: integration
        timeout-minutes: 5
        if: runner.os == 'Linux' && (matrix.project == 'p8-cedarfile' || matrix.project == 'p9-cedarrealtime' || matrix.project == 'p11-saas-workspace' || matrix.project == 'p12-hr-access-governance' || matrix.project == 'p13-student-records' || matrix.project == 'p15-marketplace')
        working-directory: ${{ matrix.project }}
        run: pnpm test:e2e
      - name: Audit dependencies
        id: audit
        timeout-minutes: 2
        working-directory: ${{ matrix.project }}
        run: pnpm audit --audit-level low

      - name: Verification summary
        if: always()
        run: node shared/tools/repository-automation/ci-report.mjs stages
        env:
          STEPS_JSON: ${{ toJSON(steps) }}

  p3-sidecar:
    name: P3 signed-token sidecar workflow
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.projects), 'p3-mcp-capability-governance')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: p3-mcp-capability-governance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: |
            p3-mcp-capability-governance/pnpm-lock.yaml
            shared/identity-provider/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e

  compose-config:
    name: Compose startup (${{ matrix.project }})
    needs: changes
    if: needs.changes.outputs.compose != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.compose) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Validate Compose
        working-directory: ${{ matrix.project }}
        run: docker compose config --quiet
      - name: Build stack
        working-directory: ${{ matrix.project }}
        run: docker compose build
      - name: Start stack
        if: matrix.project != 'p2-tenantrag'
        working-directory: ${{ matrix.project }}
        run: docker compose up -d --wait --wait-timeout 120
      - name: Start P2 identity provider
        if: matrix.project == 'p2-tenantrag'
        working-directory: ${{ matrix.project }}
        run: docker compose up -d --wait --wait-timeout 120 identity-provider
      - name: Verify localhost endpoints
        run: node shared/tools/repository-automation/smoke-localhost.mjs ${{ matrix.project }}
      - name: Stack diagnostics
        if: failure()
        working-directory: ${{ matrix.project }}
        run: docker compose logs --no-color --tail=80
      - name: Stop stack
        if: always()
        working-directory: ${{ matrix.project }}
        run: docker compose down --volumes

  compose-concurrency:
    name: Concurrent project stacks
    needs: changes
    if: needs.changes.outputs.concurrent == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Start independent stacks
        run: |
          docker compose -f p1-task-manager/compose.yaml up --build -d --wait --wait-timeout 120
          docker compose -f p4-editorial-publishing/compose.yaml up --build -d --wait --wait-timeout 120
          docker compose -f p10-warehouse-workloads/compose.yaml up --build -d --wait --wait-timeout 120
      - name: Verify simultaneous operation
        run: |
          node shared/tools/repository-automation/smoke-localhost.mjs p1-task-manager p4-editorial-publishing p10-warehouse-workloads
          docker compose -f p4-editorial-publishing/compose.yaml down --volumes
          node shared/tools/repository-automation/smoke-localhost.mjs p1-task-manager p10-warehouse-workloads
      - name: Stop owned stacks
        if: always()
        run: |
          docker compose -f p1-task-manager/compose.yaml down --volumes
          docker compose -f p4-editorial-publishing/compose.yaml down --volumes
          docker compose -f p10-warehouse-workloads/compose.yaml down --volumes

  result:
    name: Quality result
    if: always()
    needs:
      [changes, step, project, p3-sidecar, compose-config, compose-concurrency]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Check selected results
        run: node shared/tools/repository-automation/ci-result.mjs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
