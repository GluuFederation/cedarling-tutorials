services:
  configure:
    build:
      context: ..
      dockerfile: shared/identity-provider/Dockerfile
      target: bootstrap
    command: ["P3"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - identity-config:/identity-config
      - app-config:/app-config
  identity-provider:
    build:
      context: ..
      dockerfile: shared/identity-provider/Dockerfile
    command: ["node", "--env-file=/run/config/.env", "dist/main.js"]
    environment:
      IDP_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:18003:18003"
      - "127.0.0.1:17003:17003"
    volumes: [identity-config:/run/config:ro]
    depends_on:
      configure: { condition: service_completed_successfully }
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:18003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
  incident-assistant:
    build:
      context: ..
      dockerfile: p3-mcp-capability-governance/Dockerfile
    network_mode: service:identity-provider
    environment:
      P3_HOST: 0.0.0.0
    volumes: [app-config:/run/config:ro]
    depends_on:
      configure: { condition: service_completed_successfully }
      identity-provider: { condition: service_healthy }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:17003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  identity-config:
  app-config:
