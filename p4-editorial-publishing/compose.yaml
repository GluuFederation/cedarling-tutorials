services:
  configure:
    build:
      context: ..
      dockerfile: shared/identity-provider/Dockerfile
      target: bootstrap
    command: ["P4"]
    environment:
      BOOTSTRAP_ISSUER: ${P4_ISSUER:-http://idp.localhost:4000}
      BOOTSTRAP_BASE_URL: ${P4_BASE_URL:-http://p4.localhost:3004}
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - identity-config:/identity-config
      - app-config:/app-config

  identity-provider:
    build:
      context: ..
      dockerfile: shared/identity-provider/Dockerfile
    command: ["node", "--env-file=/run/config/.env", "dist/main.js"]
    environment:
      IDP_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      tutorial:
        aliases: [idp.localhost]
    volumes:
      - identity-config:/run/config:ro
    depends_on:
      configure: { condition: service_completed_successfully }
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  cedarpress:
    build:
      context: ..
      dockerfile: p4-editorial-publishing/Dockerfile
    command: ["node", "--env-file=/run/config/app.env", "scripts/serve.mjs"]
    environment:
      P4_HOST: 0.0.0.0
      P4_PORT: 3004
      P4_BASE_URL: ${P4_BASE_URL:-http://p4.localhost:3004}
      P4_DATA_DIR: /app/.local/p4-data
    ports:
      - "127.0.0.1:3004:3004"
    networks:
      tutorial:
        aliases: [p4.localhost]
    volumes:
      - app-config:/run/config:ro
      - p4-data:/app/.local/p4-data
    depends_on:
      configure: { condition: service_completed_successfully }
      identity-provider: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp:mode=1777]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

networks:
  tutorial:

volumes:
  identity-config:
  app-config:
  p4-data:
